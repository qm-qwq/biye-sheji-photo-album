<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>登录 - 个人相册系统</title>
    <!-- 引入 Bootstrap 美化样式 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card { width: 400px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="card p-4">
    <h3 class="text-center mb-4">📸 相册系统登录</h3>
    <div class="mb-3">
        <label class="form-label">用户名</label>
        <input type="text" id="username" class="form-control" placeholder="请输入用户名">
    </div>
    <div class="mb-3">
        <label class="form-label">密码</label>
        <input type="password" id="password" class="form-control" placeholder="请输入密码">
    </div>
    <button onclick="doLogin()" class="btn btn-primary w-100 mt-3">登 录</button>
</div>

<script>
    function doLogin() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        if (!username || !password) {
            alert("请输入用户名和密码！");
            return;
        }

        fetch('/api/user/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: username, password: password })
        })
        .then(res => res.json())
        .then(data => {
            if (data.code === 200) {
                alert("登录成功！");
                // 登录成功，跳转到相册列表页
                window.location.href = 'index.html';
            } else {
                alert("登录失败：" + data.msg);
            }
        })
        .catch(err => console.error("请求出错", err));
    }
</script>
</body>
</html>
